version: 1

backend:
  phases:
    preBuild:
      commands:
        - echo "=== Backend preBuild ==="
        - pwd && ls -la
        - '[ -d api ] || { echo "Falta ./api"; exit 1; }'
        - npm ci --prefix api
        - '(cd api && node_modules/.bin/prisma generate)'
    build:
      commands:
        - echo "=== Backend Build ==="
        - npm run build --prefix api
        - >
          if [ -n "$DATABASE_URL" ]; then
            (cd api && node_modules/.bin/prisma migrate deploy);
          else
            echo "Skipping migrations (no DATABASE_URL)";
          fi
        - mkdir -p api/dist/templates
        - 'cp api/templates/*.pdf api/dist/templates/ 2>/dev/null || echo "No PDFs found"'
  postBuild:
    commands:
      - echo "Backend build complete"
  artifacts:
    baseDirectory: api/dist
    files:
      - '**/*'

frontend:
  phases:
    preBuild:
      commands:
        - echo "=== Frontend preBuild ==="
        - '[ -d web ] && echo "web directory found" || { echo "Falta ./web"; exit 1; }'
        - npm ci --prefix web
        - npm i --prefix web aws-amplify || true
    build:
      commands:
        - 'echo "VITE_API_URL=$VITE_API_URL" > web/.env.production'
        - npm run build --prefix web -- --mode production
  artifacts:
    baseDirectory: web/dist
    files:
      - '**/*'
  cache:
    paths:
      - web/node_modules/**/*
      - api/node_modules/**/*
