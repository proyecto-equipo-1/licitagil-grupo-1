version: 1

backend:
  phases:
    preBuild:
      commands:
        - echo "=== Backend preBuild ==="
        - npm ci --prefix api
        - export PRISMA_CLI_QUERY_ENGINE_TYPE=binary
        - export PRISMA_CLIENT_ENGINE_TYPE=library
        # Verificar que el schema exista
        - '[ -f api/prisma/schema.prisma ] || { echo "No existe api/prisma/schema.prisma"; ls -la api/prisma || true; exit 1; }'
        # Generar el cliente indicando la ruta del schema (relativa a la raíz)
        - npx --yes prisma generate --schema=api/prisma/schema.prisma
  build:
      commands:
        - npm run build --prefix api
        - |
          if [ -n "$DATABASE_URL" ]; then
            export PRISMA_CLI_QUERY_ENGINE_TYPE=binary
            npx --yes prisma migrate deploy --schema=api/prisma/schema.prisma
          else
            echo "Skipping migrations (no DATABASE_URL)"
          fi
        - mkdir -p api/dist/templates
        - 'cp api/templates/*.pdf api/dist/templates/ 2>/dev/null || echo "No PDFs found"'
    post_build:
      commands:
        - echo "Backend build complete"
  artifacts:
    baseDirectory: api/dist
    files:
      - '**/*'

frontend:
  phases:
    preBuild:
      commands:
        - echo "=== Frontend preBuild ==="
        - '[ -d web ] || { echo "Falta ./web"; exit 1; }'
        - npm ci --prefix web
        - npm i --prefix web aws-amplify || true
    build:
      commands:
        - 'echo "VITE_API_URL=$VITE_API_URL" > web/.env.production'
        - npm run build --prefix web -- --mode production
  artifacts:
    baseDirectory: web/dist
    files:
      - '**/*'
  cache:
    paths:
      - web/node_modules/**/*
      - api/node_modules/**/*
