version: 1
backend:
  phases:
    preBuild:
      commands:
        - echo "=== Backend preBuild Phase ==="
        - pwd
        - ls -la
        - echo "Installing backend dependencies..."
        - cd api && npm ci
        - echo "Generating Prisma Client..."
        - cd api && npx prisma generate
    build:
      commands:
        - echo "=== Backend Build Phase ==="
        - echo "Building backend..."
        - cd api && npm run build
        - echo "Running database migrations if DATABASE_URL is set..."
        - 'cd api && ([ -n "$DATABASE_URL" ] && npx prisma migrate deploy || echo "Skipping migrations")'
        - echo "Creating templates directory..."
        - cd api && mkdir -p dist/templates
        - echo "Copying template PDFs..."
        - cd api && (cp templates/*.pdf dist/templates/ || echo "No PDFs found")
    post_build:
      commands:
        - echo "Backend build complete"
  artifacts:
    baseDirectory: api/dist
    files:
      - '**/*'
      - templates/**/*
frontend:
  phases:
    preBuild:
      commands:
        - echo "=== Frontend preBuild Phase ==="
        - pwd
        - ls -la
        - test -d web && echo "web directory found" || echo "web directory NOT found"
        - echo "Installing frontend dependencies..."
        - cd web && npm ci
        - echo "Installing AWS Amplify..."
        - cd web && npm install aws-amplify
    build:
      commands:
        - echo "=== Frontend Build Phase ==="
        - echo "Building React application..."
        - cd web && echo "VITE_API_URL=$VITE_API_URL" > .env.production
        - cd web && npm run build -- --mode production
  artifacts:
    baseDirectory: web/dist
    files:
      - '**/*'
  cache:
    paths:
      - web/node_modules/**/*
      - api/node_modules/**/*