version: 1

backend:
  phases:
    preBuild:
      commands:
        - echo "=== Backend preBuild ==="
        - pwd && ls -la
        - '[ -d api ] || { echo "Falta ./api"; ls -la; exit 1; }'
        - echo "Installing backend dependencies..."
        - npm ci --prefix api
        - echo "Generating Prisma Client (si no lo hizo postinstall)..."
        - npx --yes prisma generate --schema=api/prisma/schema.prisma
    build:
      commands:
        - echo "=== Backend Build ==="
        - npm run build --prefix api
        - echo "Running prisma migrate deploy (si hay DATABASE_URL)..."
        - '[ -n "$DATABASE_URL" ] && npx --yes prisma migrate deploy --schema=api/prisma/schema.prisma || echo "Skipping migrations"'
        - echo "Copying template PDFs..."
        - mkdir -p api/dist/templates
        - 'cp api/templates/*.pdf api/dist/templates/ 2>/dev/null || echo "No PDFs found"'
    post_build:
      commands:
        - echo "Backend build complete"
  artifacts:
    baseDirectory: api/dist
    files:
      - '**/*'
      - templates/**/*

frontend:
  phases:
    preBuild:
      commands:
        - echo "=== Frontend preBuild ==="
        - pwd && ls -la
        - '[ -d web ] || { echo "Falta ./web"; ls -la; exit 1; }'
        - echo "Installing frontend dependencies..."
        - npm ci --prefix web
        - echo "Installing AWS Amplify (si no está en package.json, de lo contrario omite esto)..."
        - npm i aws-amplify --prefix web || true
    build:
      commands:
        - echo "=== Frontend Build ==="
        - 'echo "VITE_API_URL=$VITE_API_URL" > web/.env.production'
        - npm run build --prefix web -- --mode production
  artifacts:
    baseDirectory: web/dist
    files:
      - '**/*'
  cache:
    paths:
      - web/node_modules/**/*
      - api/node_modules/**/*
