version: 1

backend:
  phases:
    preBuild:
      commands:
        - echo "=== Backend preBuild ==="
        - pwd && ls -la
        - '[ -d api ] || { echo "Falta ./api"; exit 1; }'
        - echo "Node version:" && node -v
        # (Opcional) si tu imagen trae nvm y quieres fijar Node 20:
        # - nvm install 20 && nvm use 20 && node -v

        # 1) Instalar deps del backend
        - npm ci --prefix api

        # 2) Forzar engines de Prisma (evitar WASM en CI)
        - export PRISMA_CLI_QUERY_ENGINE_TYPE=binary
        - export PRISMA_CLIENT_ENGINE_TYPE=library

        # 3) Generar Prisma Client usando el CLI de api/
        - echo "Generating Prisma Client..."
        - npm exec --prefix api prisma generate
    build:
      commands:
        - echo "=== Backend Build ==="
        - npm run build --prefix api

        # Migraciones solo si DATABASE_URL existe
        - 'if [ -n "$DATABASE_URL" ]; then export PRISMA_CLI_QUERY_ENGINE_TYPE=binary; npm exec --prefix api prisma migrate deploy; else echo "Skipping migrations"; fi'

        # Copiar PDFs
        - mkdir -p api/dist/templates
        - 'cp api/templates/*.pdf api/dist/templates/ 2>/dev/null || echo "No PDFs found"'
    post_build:
      commands:
        - echo "Backend build complete"
  artifacts:
    baseDirectory: api/dist
    files:
      - '**/*'

frontend:
  phases:
    preBuild:
      commands:
        - echo "=== Frontend preBuild ==="
        - '[ -d web ] || { echo "Falta ./web"; exit 1; }'
        - npm ci --prefix web
        - npm i --prefix web aws-amplify || true
    build:
      commands:
        - 'echo "VITE_API_URL=$VITE_API_URL" > web/.env.production'
        - npm run build --prefix web -- --mode production
  artifacts:
    baseDirectory: web/dist
    files:
      - '**/*'
  cache:
    paths:
      - web/node_modules/**/*
      - api/node_modules/**/*
